name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Never paste real secret values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run secmgr link lumen-api
        2. Run secmgr run --env staging -- env
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Dashboard, CLI, API, Self-hosted Docker, Homepage]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `secmgr version`, or the commit you run.
